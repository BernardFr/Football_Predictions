[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-predictions"
version = "0.2.0"
description = "Dixon-Coles football match forecasts with walk-forward backtests, a live feedback ledger and lineup adjustments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "requests>=2.31",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
football-predictions = "football_predictions.cli:main"
football-score-histogram = "football_predictions.histogram:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
