# Publishes the website (site/, built by `football-predictions site`) to GitHub Pages.
# Runs whenever a new version of the site is pushed, or on demand ("Run workflow" button).
name: Publish site
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v5
